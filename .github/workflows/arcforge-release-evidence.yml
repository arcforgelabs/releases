name: Arc Forge Release Evidence

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Release evidence directory name, for example explainer-0.1.9
        required: true
        type: string
      source_repo:
        description: Product repository that owns the release ref, for example arcforgelabs/marketplace
        required: true
        type: string
      release_ref:
        description: Optional release ref, tag, branch, or SHA in the source repository
        required: false
        default: ""
        type: string
      package_spec:
        description: Optional @arcforgelabs package spec covered by this evidence
        required: false
        default: ""
        type: string
      runs:
        description: "One per line: <label> <owner/repo> <run-id> <blocking|advisory>"
        required: true
        type: string
      notes:
        description: Optional release-manager notes to append to the evidence markdown
        required: false
        default: ""
        type: string
  # A product release workflow sends the same fields as client_payload.
  repository_dispatch:
    types:
      - arcforge_release_completed

concurrency:
  group: arcforge-release-evidence-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_id || inputs.release_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.22.1"
  RELEASE_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_id || inputs.release_id }}
  SOURCE_REPO: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_repo || inputs.source_repo }}
  RELEASE_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_ref || inputs.release_ref }}
  PACKAGE_SPEC: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.package_spec || inputs.package_spec }}

jobs:
  write_evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Write workflow inputs to files
        env:
          INPUT_RUNS: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.runs || inputs.runs }}
          INPUT_NOTES: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.notes || inputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arcforge-release-evidence"
          printf '%s\n' "$INPUT_RUNS" > "$RUNNER_TEMP/arcforge-release-evidence/runs.txt"
          printf '%s\n' "$INPUT_NOTES" > "$RUNNER_TEMP/arcforge-release-evidence/notes.md"

      - name: Generate release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/arcforge-release-evidence.mjs \
            --release-id "$RELEASE_ID" \
            --source-repo "$SOURCE_REPO" \
            --release-ref "$RELEASE_REF" \
            --package-spec "$PACKAGE_SPEC" \
            --runs-file "$RUNNER_TEMP/arcforge-release-evidence/runs.txt" \
            --notes-file "$RUNNER_TEMP/arcforge-release-evidence/notes.md"

      - name: Append run summary
        run: |
          set -euo pipefail
          evidence_md="evidence/${RELEASE_ID}/release-evidence.md"
          {
            cat "$evidence_md"
            echo
            echo "Evidence path: \`$evidence_md\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit evidence to main
        run: bash scripts/publish-release-evidence.sh
